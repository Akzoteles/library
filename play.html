<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Game Room — a video game backlog</title>
<meta name="description" content="A personal video game shelf, with notes on each one.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-room="play">

  <nav id="room-nav" aria-label="Switch room"></nav>

  <header class="site-header">
    <p class="eyebrow">a personal backlog</p>
    <h1 class="site-title">The Game Room</h1>
    <p class="site-sub">Click a cover for my take on it — and where to grab it yourself.</p>
  </header>

  <main id="shelves" aria-label="Game shelf"></main>

  <div id="sentinel" aria-hidden="true"></div>

  <p id="end-message" hidden>— that's every game on the shelf —</p>
  <p id="empty-message" hidden>The shelf is empty. Add some games in <code>games-data.js</code>.</p>

  <div id="filter-bar" role="group" aria-label="Filter by category"></div>

  <div id="modal-overlay" hidden>
    <div id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" type="button" aria-label="Close">&times;</button>
      <div class="modal-cover-wrap">
        <img id="modal-cover" alt="">
      </div>
      <div class="modal-body">
        <p class="modal-eyebrow" id="modal-author"></p>
        <h2 id="modal-title"></h2>
        <span id="modal-status" class="status-pill"></span>
        <div class="modal-note">
          <p class="modal-note-label">My note</p>
          <p id="modal-note-text"></p>
        </div>
        <a id="modal-link" class="checkout-link" target="_blank" rel="noopener noreferrer">
          Play it <span aria-hidden="true">&rarr;</span>
        </a>
      </div>
    </div>
  </div>

  <script src="games-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
